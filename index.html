<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NABH Readiness Dashboard — Sundaram / Silverline (Live)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --ink:#132024;
    --paper:#F1EFE8;
    --panel:#FFFFFF;
    --line:#DCD8CC;
    --teal:#0E5C57;
    --teal-deep:#0A3F3C;
    --amber:#C77D2E;
    --rust:#B4472E;
    --sage:#5E8C74;
    --muted:#6B7472;
    --yes:#0E5C57;
    --no:#C0532F;
    --none:#D8D2C2;
    --mono: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;
    --sans: 'IBM Plex Sans', 'Inter', -apple-system, sans-serif;
    --serif: 'Source Serif 4', Georgia, serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:wght@500;600&display=swap');

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  body{min-height:100vh;}

  .app{display:grid;grid-template-columns:300px 1fr;min-height:100vh;}
  @media (max-width:860px){ .app{grid-template-columns:1fr;} .sidebar{position:static; max-height:none;} }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--teal-deep);
    color:#EDEAE0;
    padding:22px 16px 24px;
    max-height:100vh;
    overflow-y:auto;
    position:sticky;
    top:0;
    border-right:1px solid #06282619;
  }
  .brand{margin-bottom:18px;}
  .brand .eyebrow{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
    color:#8FBDB4; margin-bottom:6px;
  }
  .brand h1{font-family:var(--serif); font-size:21px; font-weight:600; margin:0 0 4px; line-height:1.25; color:#fff;}
  .brand .sub{font-size:12px; color:#9FC3BB; line-height:1.5;}

  .searchbox{margin:16px 0 10px;}
  .searchbox input{
    width:100%; padding:8px 10px; border-radius:6px; border:1px solid #1c5b53;
    background:#0d4a45; color:#EDEAE0; font-family:var(--sans); font-size:13px;
  }
  .searchbox input::placeholder{color:#7FAFA6;}

  .nav-group-label{
    font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    color:#7FAFA6; margin:16px 4px 6px;
  }
  .dept-btn{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    width:100%; text-align:left; background:transparent; border:none; cursor:pointer;
    color:#DCE7E3; padding:8px 8px; border-radius:6px; font-size:13px; font-family:var(--sans);
    line-height:1.3;
  }
  .dept-btn:hover{background:#124F49;}
  .dept-btn.active{background:#EDEAE0; color:var(--teal-deep); font-weight:600;}
  .dept-name{flex:1;}
  .dept-pct{font-family:var(--mono); font-size:11.5px; opacity:.85; flex-shrink:0;}
  .dept-btn.active .dept-pct{opacity:1;}
  .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-right:7px;}
  .dot.err{background:#8a8a8a !important;}

  .sync-box{margin-top:18px; padding-top:14px; border-top:1px solid #1c5b53;}
  .sync-status{font-family:var(--mono); font-size:10.5px; color:#9FC3BB; line-height:1.6;}
  .sync-status b{color:#EDEAE0;}
  .refresh-btn{
    margin-top:8px; width:100%; padding:8px; border-radius:6px; border:1px solid #2c7368;
    background:#0d4a45; color:#EDEAE0; font-family:var(--mono); font-size:11px; letter-spacing:.05em;
    text-transform:uppercase; cursor:pointer;
  }
  .refresh-btn:hover{background:#124F49;}
  .refresh-btn:disabled{opacity:.5; cursor:default;}

  /* ---------- Main ---------- */
  .main{padding:28px 34px 60px; max-width:1180px;}
  @media (max-width:860px){ .main{padding:20px 16px 50px;} }

  .top-row{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:6px; flex-wrap:wrap;}
  .dept-title{font-family:var(--serif); font-size:32px; font-weight:600; margin:0; color:var(--teal-deep); letter-spacing:-.01em;}
  .dept-meta{font-family:var(--mono); font-size:11.5px; color:var(--muted); margin-top:6px;}

  .controls-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .live-badge{
    display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10.5px;
    letter-spacing:.08em; text-transform:uppercase; color:var(--teal); border:1px solid var(--teal);
    padding:5px 10px; border-radius:20px; background:#E5EFEC; white-space:nowrap;
  }
  .live-dot{width:6px;height:6px;border-radius:50%; background:var(--teal); animation:pulse 1.8s infinite;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.35;}}

  .month-select-wrap{
    display:inline-flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line);
    border-radius:20px; padding:4px 6px 4px 12px;
  }
  .month-select-wrap label{
    font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
  }
  .month-select-wrap select{
    font-family:var(--sans); font-size:12.5px; font-weight:600; color:var(--teal-deep);
    border:none; background:#EDEAE0; border-radius:14px; padding:5px 10px; cursor:pointer; outline:none;
  }

  .banner{
    background:#FBF3E4; border:1px solid #E6D2A8; border-left:3px solid var(--amber);
    border-radius:4px; padding:12px 14px; margin:16px 0 22px; font-size:12.5px; line-height:1.55; color:#5C4419;
  }
  .banner b{color:#3E2E0F;}
  .banner.error{background:#FBEAE4; border-color:#E6B4A0; border-left-color:var(--rust); color:#5C2410;}

  .grid4{display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; margin-bottom:26px;}
  @media (max-width:940px){ .grid4{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:520px){ .grid4{grid-template-columns:1fr;} }

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px 16px 14px;
    display:flex; flex-direction:column; align-items:center; position:relative;
  }
  .card h3{
    font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--teal-deep); margin:0 0 10px; text-align:center;
  }
  .card .static-tag{
    position:absolute; top:12px; right:12px; font-family:var(--mono); font-size:8.5px; letter-spacing:.05em;
    text-transform:uppercase; color:var(--muted); background:#EDEAE0; padding:2px 6px; border-radius:8px;
  }
  .card .chart-wrap{width:150px; height:150px; position:relative;}
  .card .center-pct{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .center-pct .num{font-family:var(--serif); font-size:24px; font-weight:600; color:var(--ink);}
  .center-pct .lbl{font-family:var(--mono); font-size:9px; color:var(--muted); margin-top:1px;}
  .card .frac{font-family:var(--mono); font-size:12px; color:var(--muted); margin-top:10px;}
  .card.empty .chart-wrap{display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:11px; text-align:center; font-family:var(--mono);}
  .card.empty{opacity:.7;}

  .section-label{
    font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--teal-deep); margin:30px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }

  .items-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:0 24px;}
  @media (max-width:700px){ .items-grid{grid-template-columns:1fr;} }
  .items-col h4{
    font-family:var(--sans); font-size:12.5px; font-weight:600; color:var(--teal-deep); margin:14px 0 6px;
    display:flex; align-items:center; gap:6px;
  }
  .items-col h4 .badge{
    font-family:var(--mono); font-size:10px; color:#fff; background:var(--muted); padding:1px 6px; border-radius:10px;
  }
  ul.item-list{list-style:none; margin:0 0 6px; padding:0; font-size:12.5px;}
  ul.item-list li{
    display:flex; align-items:center; gap:7px; padding:3px 0; color:#3A4442; border-bottom:1px dashed #E7E3D6;
  }
  ul.item-list li .tag{
    font-family:var(--mono); font-size:9px; letter-spacing:.05em; text-transform:uppercase; padding:1px 6px; border-radius:9px; flex-shrink:0;
  }
  .tag.yes{background:#E1EEE9; color:var(--yes);}
  .tag.no{background:#F7E4DC; color:var(--no);}
  .none-note{font-size:12px; color:var(--muted); font-style:italic; padding:6px 0;}

  /* ---------- Overview ---------- */
  .ov-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:18px 0 30px;}
  @media (max-width:940px){ .ov-grid{grid-template-columns:repeat(2,1fr);} }
  .ov-card{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px 18px;}
  .ov-card .k{font-family:var(--serif); font-size:30px; font-weight:600; color:var(--teal-deep);}
  .ov-card .l{font-family:var(--mono); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-top:4px;}

  table.ov-table{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:6px;}
  table.ov-table th{
    text-align:left; font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted); border-bottom:1px solid var(--line); padding:8px 8px;
  }
  table.ov-table td{padding:7px 8px; border-bottom:1px solid #EDEAE0; vertical-align:middle;}
  table.ov-table tr:hover{background:#FBFAF6; cursor:pointer;}
  .bar-cell{display:flex; align-items:center; gap:8px;}
  .bar-track{flex:1; height:6px; background:#EAE6D9; border-radius:3px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:3px;}
  .pct-txt{font-family:var(--mono); font-size:11.5px; width:38px; text-align:right; flex-shrink:0;}
  .status-pill{font-family:var(--mono); font-size:9.5px; padding:2px 7px; border-radius:9px; text-transform:uppercase; letter-spacing:.04em;}

  footer.note{margin-top:40px; font-size:11px; color:var(--muted); font-family:var(--mono); line-height:1.7; border-top:1px solid var(--line); padding-top:14px;}

  .loading-screen{
    display:flex; flex-direction:column; align-items:center; justify-content:center; height:60vh; gap:14px;
  }
  .spinner{
    width:34px; height:34px; border-radius:50%; border:3px solid #DCD8CC; border-top-color:var(--teal);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-screen .msg{font-family:var(--mono); font-size:12px; color:var(--muted);}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar">
    <div class="brand">
      <div class="eyebrow">NABH · Quality Readiness</div>
      <h1>Department Compliance Dashboard</h1>
      <div class="sub">Live from Google Sheets — Registers · SOPs · KPIs · Audits, month-wise</div>
    </div>
    <div class="searchbox"><input type="text" id="searchInput" placeholder="Search department..."></div>
    <div class="nav-group-label">Overview</div>
    <button class="dept-btn" id="overviewBtn" data-dept="__overview__">
      <span class="dept-name">Hospital-wide Summary</span>
    </button>
    <div class="nav-group-label">Departments</div>
    <div id="deptList"></div>
    <div class="sync-box">
      <div class="sync-status" id="syncStatus">Connecting to Google Sheets…</div>
      <button class="refresh-btn" id="refreshBtn">Refresh now</button>
    </div>
  </nav>

  <main class="main" id="main">
    <div class="loading-screen">
      <div class="spinner"></div>
      <div class="msg">Pulling live data from Google Sheets…</div>
    </div>
  </main>
</div>

<script>
/* ============================================================
   CONFIG — the only two things to change if the sheet moves
   ============================================================ */
const SHEET_ID = '1Fa9uU_4VMwIE-p6YwKjDy0xaKP1RKSO5I2O0nl9WD68';

// Google tab name -> friendly display name shown in the dashboard.
// Add a new line here if a brand-new department tab is created.
const DEPT_TABS = [
  ['OT OT', 'Operation Theatre (OT)'],
  ['IPC', 'Infection Prevention & Control (IPC)'],
  ['Radiology', 'Radiology'],
  ['Patient counselor', 'Patient Counselor'],
  ['Cathlab', 'Cath Lab'],
  ['CSSD', 'CSSD'],
  ['Pharmacy Store', 'Pharmacy Store'],
  ['Reception', 'Reception'],
  ['MRD', 'Medical Records (MRD)'],
  ['4th Floor', '4th Floor (IPD)'],
  ['ER', 'Emergency Room (ER)'],
  ['Floor Manager', 'Floor Manager'],
  ['3rd floor', '3rd Floor (IPD)'],
  ['Day care', 'Day Care'],
  ['IT', 'IT'],
  ['BME', 'Biomedical Engineering (BME)'],
  ['Facility', 'Facility'],
  ['Billing', 'Billing'],
  ['DIALYSIS', 'Dialysis'],
  ['ICU', 'ICU'],
  ['IP. Pharmacy', 'IP Pharmacy'],
  ['OPD 1st Floor', 'OPD - 1st Floor'],
  ['OPD 2nd Flr', 'OPD - 2nd Floor'],
  ['HR', 'Human Resources (HR)'],
  ['Lab', 'Laboratory'],
  ['OP Pharmacy', 'OP Pharmacy'],
  ['Dietitian', 'Dietitian'],
  ['RT', 'Respiratory Therapy (RT)'],
  ['Mep', 'MEP / Maintenance'],
  ['Insurance', 'Insurance'],
  ['Paediatric', 'Paediatrics'],
  ['Surgical oncology', 'Surgical Oncology'],
  ['Medical oncology', 'Medical Oncology'],
  ['Radiation Oncology', 'Radiation Oncology'],
  ['Endoscopy', 'Endoscopy'],
  ['Labour room(Obstetric services)', 'Labour Room (Obstetrics)'],
  ['Physio', 'Physiotherapy'],
  ['Dental', 'Dental'],
  ['opthomal', 'Ophthalmology'],
  ['Blood bank', 'Blood Bank'],
  ['Sample Collection', 'Sample Collection'],
  ['Nursing III Flr', 'Nursing - 3rd Floor'],
  ['qc', 'Quality Cell (QC)'],
];

const AUTO_REFRESH_MS = 5 * 60 * 1000; // re-pull every 5 minutes while page is open

/* ============================================================
   CSV fetch + parse (mirrors the same logic used to build the
   original static version, now running live in the browser)
   ============================================================ */
const CATS = ['Registers','KPIs','SOPs','Audits'];
const CANON_ORDER = ['Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov'];
const MONTH_MAP = {jan:'Jan',feb:'Feb',mar:'Mar',apr:'Apr',may:'May',jun:'Jun',jul:'Jul',aug:'Aug',sep:'Sep',oct:'Oct',nov:'Nov',dec:'Dec'};
const MONTH_RE = /^(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/i;

function hasVal(v){ return v !== null && v !== undefined && String(v).trim() !== ''; }
function isYes(v){ return hasVal(v) && String(v).trim().toLowerCase().startsWith('y'); }

function monthKeyFromCell(v){
  if(!hasVal(v)) return null;
  const s = String(v).trim();
  const m = s.match(MONTH_RE);
  if(m) return MONTH_MAP[m[1].toLowerCase()];
  // fallback: try to parse as a date (covers "12/25/2025" style headers)
  if(/\d/.test(s)){
    const d = new Date(s);
    if(!isNaN(d.getTime())){
      const names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return names[d.getMonth()];
    }
  }
  return null;
}

function classifySection(text){
  const t = text.toLowerCase();
  if(t.includes('register')) return 'Registers';
  if(t.includes('kpi')) return 'KPIs';
  if(t.includes('sop')) return 'SOPs';
  if(t.includes('audit')) return 'Audits';
  return null;
}

function findMonthHeader(rows){
  const maxScan = Math.min(6, rows.length);
  for(let i=0;i<maxScan;i++){
    const row = rows[i];
    const cells = row.slice(2);
    const keys = cells.map(monthKeyFromCell);
    const hits = keys.filter(k=>k).length;
    if(hits >= 3) return {headerIdx:i, monthKeys:keys};
  }
  return {headerIdx:null, monthKeys:[]};
}

const STATIC_MARKER_LABELS = new Set(['kpi','kpi data','sop','sop data','audit','audits','registers',
  'list of registers','audit list','nabh tasks','work tasks']);

function parseSheetRows(rows){
  const {headerIdx, monthKeys} = findMonthHeader(rows);
  const nMonthCols = monthKeys.length;
  const sections = {Registers:[], KPIs:[], SOPs:[], Audits:[]};
  let current = null;

  rows.forEach((r, ridx) => {
    if(headerIdx !== null && ridx === headerIdx) return;
    const a = r[0];
    const b = r.length>1 ? r[1] : null;
    const rest = r.length>2 ? r.slice(2) : [];
    if(!hasVal(a) && r.every(c=>!hasVal(c))) return; // blank separator row

    const aStr = hasVal(a) ? String(a).trim() : '';
    const label = aStr ? classifySection(aStr) : null;
    let looksLikeMarker = false;
    if(label){
      if(rest.length && rest.some(c=>monthKeyFromCell(c))){
        looksLikeMarker = true;
      } else if(!hasVal(b) || (typeof b==='string' && (b.toLowerCase().includes('source') || b.toLowerCase().includes('type of')))){
        if(!rest.some(c=>hasVal(c))){
          looksLikeMarker = true;
        } else if(STATIC_MARKER_LABELS.has(aStr.toLowerCase())){
          looksLikeMarker = true;
        }
      }
    }
    if(looksLikeMarker){ current = label; return; }

    if(current === null) current = 'Registers';
    if(aStr === '') return;

    const monthlyVals = {};
    if(nMonthCols){
      monthKeys.forEach((mk, ci) => {
        if(!mk) return;
        const val = ci < rest.length ? rest[ci] : null;
        if(!(mk in monthlyVals) || hasVal(val)) monthlyVals[mk] = val;
      });
    }
    let lastVal = null;
    rest.forEach(v => { if(hasVal(v)) lastVal = v; });

    sections[current].push({
      name: aStr,
      monthly: Object.keys(monthlyVals).length ? monthlyVals : null,
      hasMonthlyData: Object.keys(monthlyVals).length>0 && Object.values(monthlyVals).some(hasVal),
      overall: isYes(lastVal)
    });
  });

  const deptMonths = CANON_ORDER.filter(mk => monthKeys.includes(mk));
  return {months: deptMonths, sections};
}

function finalizeDept(parsed){
  const {months, sections} = parsed;
  const outSections = {};
  CATS.forEach(cat => {
    const items = sections[cat];
    const n = items.length;
    const nMonthly = items.filter(it=>it.hasMonthlyData).length;
    const isMonthly = months.length>0 && n>0 && (nMonthly/n) >= 0.5;
    const outItems = items.map(it => {
      if(isMonthly){
        const md = it.monthly || {};
        const full = {};
        months.forEach(m => full[m] = !!isYes(md[m]));
        return {name: it.name, monthly: full};
      } else {
        return {name: it.name, overall: it.overall};
      }
    });
    outSections[cat] = {monthly: isMonthly, items: outItems};
  });
  return {months, sections: outSections};
}

function csvUrlFor(tabName){
  const encoded = encodeURIComponent(tabName);
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encoded}`;
}

async function fetchTabRows(tabName){
  const url = csvUrlFor(tabName);
  const res = await fetch(url, {cache:'no-store'});
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  const parsed = Papa.parse(text.trim(), {skipEmptyLines:false});
  if(parsed.errors && parsed.errors.length && (!parsed.data || !parsed.data.length)){
    throw new Error('CSV parse failed');
  }
  return parsed.data.map(row => row.map(c => (c===undefined || c==='') ? null : c));
}

/* ============================================================
   Data load orchestration
   ============================================================ */
let DATA = {};
let loadErrors = [];
let lastSyncTime = null;

function sleep(ms){ return new Promise(res => setTimeout(res, ms)); }

// Fetch one tab with a few retries + backoff, since Google's export endpoint
// can transiently rate-limit bursts of concurrent requests to the same sheet.
async function fetchTabWithRetry(tabName, attempts=3){
  let lastErr;
  for(let i=0; i<attempts; i++){
    try{
      return await fetchTabRows(tabName);
    } catch(err){
      lastErr = err;
      if(i < attempts-1) await sleep(400 * Math.pow(2, i) + Math.random()*200);
    }
  }
  throw lastErr;
}

// Process departments in small batches (not all 43 at once) so we don't
// trip Google's per-second request limits for the same spreadsheet.
const BATCH_SIZE = 5;
const BATCH_GAP_MS = 300;

async function loadAllDepartments(){
  loadErrors = [];
  const newData = {};

  for(let i=0; i<DEPT_TABS.length; i+=BATCH_SIZE){
    const batch = DEPT_TABS.slice(i, i+BATCH_SIZE);
    const results = await Promise.allSettled(batch.map(async ([tabName, display]) => {
      const rows = await fetchTabWithRetry(tabName);
      const hasAny = rows.some(r => r.some(hasVal));
      if(!hasAny){
        return [display, {months:[], sections:{Registers:{monthly:false,items:[]},KPIs:{monthly:false,items:[]},SOPs:{monthly:false,items:[]},Audits:{monthly:false,items:[]}}}];
      }
      const parsed = parseSheetRows(rows);
      return [display, finalizeDept(parsed)];
    }));

    results.forEach((r, j) => {
      const [, display] = batch[j];
      if(r.status === 'fulfilled'){
        newData[r.value[0]] = r.value[1];
      } else {
        loadErrors.push(display);
        newData[display] = DATA[display] || {months:[], sections:{Registers:{monthly:false,items:[]},KPIs:{monthly:false,items:[]},SOPs:{monthly:false,items:[]},Audits:{monthly:false,items:[]}}, _error:true};
      }
    });

    if(i + BATCH_SIZE < DEPT_TABS.length) await sleep(BATCH_GAP_MS);
  }

  DATA = newData;
  lastSyncTime = new Date();
}

/* ============================================================
   Rendering (same design/behaviour as the original dashboard)
   ============================================================ */
let GLOBAL_MONTHS = [];
let selectedMonth = null;
let currentCharts = [];
let currentDept = '__overview__';

function pct(y,t){ return t>0 ? Math.round((y/t)*100) : null; }

function sectionCounts(dept, cat){
  const sec = DATA[dept].sections[cat];
  const items = sec.items;
  if(sec.monthly){
    const t = items.length;
    const y = items.filter(it => selectedMonth && it.monthly && it.monthly[selectedMonth]).length;
    return {y, t, applicable: !!selectedMonth};
  } else {
    const t = items.length;
    const y = items.filter(it => it.overall).length;
    return {y, t, applicable: true};
  }
}

function overallDeptCounts(dept){
  let y=0,t=0;
  CATS.forEach(c=>{ const r = sectionCounts(dept,c); y+=r.y; t+=r.t; });
  return {y,t,pct: pct(y,t)};
}

function statusColor(p){
  if(p===null) return '#B9B4A2';
  if(p>=80) return '#0E5C57';
  if(p>=50) return '#C77D2E';
  return '#B4472E';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function destroyCharts(){ currentCharts.forEach(c=>c.destroy()); currentCharts=[]; }

function renderSidebar(filter=''){
  const deptListEl = document.getElementById('deptList');
  const deptNames = Object.keys(DATA);
  deptListEl.innerHTML = '';
  deptNames.filter(d=>d.toLowerCase().includes(filter.toLowerCase())).forEach(d=>{
    const {pct:p} = overallDeptCounts(d);
    const isErr = !!DATA[d]._error;
    const btn = document.createElement('button');
    btn.className='dept-btn';
    btn.dataset.dept = d;
    btn.innerHTML = `<span style="display:flex;align-items:center;min-width:0;">
        <span class="dot ${isErr?'err':''}" style="background:${isErr?'':statusColor(p)}"></span>
        <span class="dept-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${d}</span>
      </span>
      <span class="dept-pct">${isErr?'⚠':(p===null?'—':p+'%')}</span>`;
    btn.addEventListener('click', ()=> selectDept(d));
    deptListEl.appendChild(btn);
  });
}

function setActive(dept){
  document.querySelectorAll('.dept-btn').forEach(b=>b.classList.toggle('active', b.dataset.dept===dept));
}

function selectDept(dept){
  currentDept = dept;
  setActive(dept);
  if(dept==='__overview__'){ renderOverview(); }
  else { renderDept(dept); }
}

function onMonthChange(newMonth){
  selectedMonth = newMonth;
  renderSidebar(document.getElementById('searchInput').value);
  setActive(currentDept);
  if(currentDept==='__overview__'){ renderOverview(); } else { renderDept(currentDept); }
}

function monthControlHtml(idPrefix){
  if(GLOBAL_MONTHS.length===0) return '';
  const opts = GLOBAL_MONTHS.map(m=>`<option value="${m}" ${m===selectedMonth?'selected':''}>${m}</option>`).join('');
  return `<div class="month-select-wrap">
    <label for="${idPrefix}_monthSel">Month</label>
    <select id="${idPrefix}_monthSel">${opts}</select>
  </div>`;
}

function bindMonthControl(idPrefix){
  const el = document.getElementById(`${idPrefix}_monthSel`);
  if(el) el.addEventListener('change', e=> onMonthChange(e.target.value));
}

function makePie(canvasId, yes, no){
  const ctx = document.getElementById(canvasId).getContext('2d');
  const total = yes+no;
  const chart = new Chart(ctx, {
    type:'doughnut',
    data:{
      labels:['Completed / Yes','Pending / No'],
      datasets:[{ data: total>0 ? [yes,no] : [1], backgroundColor: total>0 ? ['#0E5C57','#E3DFD0'] : ['#EDEAE0'], borderWidth:0, hoverOffset:total>0?4:0 }]
    },
    options:{
      responsive:true, maintainAspectRatio:false, cutout:'72%',
      plugins:{ legend:{display:false}, tooltip:{enabled: total>0} }
    }
  });
  currentCharts.push(chart);
}

function renderDept(dept){
  const d = DATA[dept];
  const main = document.getElementById('main');
  const {y,t,pct:overallPct} = overallDeptCounts(dept);
  const deptHasMonths = d.months && d.months.length>0;

  if(d._error){
    main.innerHTML = `
      <div class="top-row">
        <div><h2 class="dept-title">${dept}</h2></div>
        <div class="controls-row"><div class="live-badge"><span class="live-dot"></span>Live from Google Sheets</div></div>
      </div>
      <div class="banner error"><b>Couldn't load this department's tab just now.</b> This is usually a transient hiccup, not a broken link. Click retry below, or "Refresh now" in the sidebar.</div>
      <button class="refresh-btn" style="width:auto;padding:8px 16px;" id="retryOneBtn">Retry ${escapeHtml(dept)}</button>
    `;
    destroyCharts();
    const retryBtn = document.getElementById('retryOneBtn');
    if(retryBtn) retryBtn.addEventListener('click', async ()=>{
      retryBtn.disabled = true; retryBtn.textContent = 'Retrying…';
      const entry = DEPT_TABS.find(([,disp]) => disp === dept);
      if(entry){
        try{
          const rows = await fetchTabWithRetry(entry[0]);
          const hasAny = rows.some(r => r.some(hasVal));
          DATA[dept] = hasAny ? finalizeDept(parseSheetRows(rows)) : {months:[], sections:{Registers:{monthly:false,items:[]},KPIs:{monthly:false,items:[]},SOPs:{monthly:false,items:[]},Audits:{monthly:false,items:[]}}};
          loadErrors = loadErrors.filter(x=>x!==dept);
          renderSidebar(document.getElementById('searchInput').value);
          setActive(dept);
          renderDept(dept);
        } catch(err){
          retryBtn.disabled = false; retryBtn.textContent = `Retry ${dept}`;
        }
      }
    });
    return;
  }

  let cardsHtml = '';
  CATS.forEach((cat,i)=>{
    const sec = d.sections[cat];
    const r = sectionCounts(dept, cat);
    const canvasId = `pie_${i}`;
    if(r.t===0){
      cardsHtml += `<div class="card empty">
        <h3>${cat}</h3>
        <div class="chart-wrap">No list<br>defined yet</div>
        <div class="frac">0 items tracked</div>
      </div>`;
    } else if(sec.monthly && !r.applicable){
      cardsHtml += `<div class="card empty">
        <h3>${cat}</h3>
        <div class="chart-wrap">No data for<br>this month</div>
        <div class="frac">${r.t} items tracked</div>
      </div>`;
    } else {
      const p = pct(r.y, r.t);
      cardsHtml += `<div class="card">
        ${sec.monthly ? '' : '<div class="static-tag">Static</div>'}
        <h3>${cat}</h3>
        <div class="chart-wrap">
          <canvas id="${canvasId}"></canvas>
          <div class="center-pct"><div class="num">${p}%</div><div class="lbl">DONE</div></div>
        </div>
        <div class="frac">${r.y} / ${r.t} complete</div>
      </div>`;
    }
  });

  let itemsHtml = '';
  CATS.forEach(cat=>{
    const sec = d.sections[cat];
    const items = sec.items || [];
    if(items.length===0){
      itemsHtml += `<div class="items-col">
        <h4>${cat} <span class="badge">0</span></h4>
        <div class="none-note">No ${cat.toLowerCase()} list has been entered for this department yet.</div>
      </div>`;
      return;
    }
    const getStatus = it => sec.monthly ? (selectedMonth ? !!(it.monthly && it.monthly[selectedMonth]) : false) : !!it.overall;
    const pending = items.filter(it=>!getStatus(it));
    const done = items.filter(it=>getStatus(it));
    itemsHtml += `<div class="items-col">
      <h4>${cat} <span class="badge">${items.length}</span>${sec.monthly && selectedMonth ? `<span class="badge" style="background:var(--teal)">${selectedMonth}</span>` : ''}</h4>
      <ul class="item-list">
        ${pending.map(it=>`<li><span class="tag no">Pending</span>${escapeHtml(it.name)}</li>`).join('')}
        ${done.map(it=>`<li><span class="tag yes">Done</span>${escapeHtml(it.name)}</li>`).join('')}
      </ul>
    </div>`;
  });

  main.innerHTML = `
    <div class="top-row">
      <div>
        <h2 class="dept-title">${dept}</h2>
        <div class="dept-meta">${t} tracked items across ${CATS.length} categories · overall ${overallPct===null?'—':overallPct+'% complete'}${selectedMonth?` · viewing ${selectedMonth}`:''}</div>
      </div>
      <div class="controls-row">
        ${deptHasMonths ? monthControlHtml('dept') : ''}
        <div class="live-badge"><span class="live-dot"></span>Live from Google Sheets</div>
      </div>
    </div>
    <div class="banner"><b>How to read this:</b> each pie shows Yes (completed/maintained) vs No (missing, blank, or not yet started) for that category's item list, for the selected month. Categories marked <b>Static</b> aren't tracked month-by-month in the source sheet — they show one overall status instead. An empty card means no list of items exists yet for that category — that's a gap to close before the NABH survey.</div>
    <div class="grid4">${cardsHtml}</div>
    <div class="section-label"><span>Item-level breakdown — what's pending${selectedMonth?` for ${selectedMonth}`:''}</span></div>
    <div class="items-grid">${itemsHtml}</div>
    <footer class="note">Source: live Google Sheet, fetched directly by your browser on load and on refresh. "No" is assigned to any blank / unrecorded cell. New months or rows added in the sheet appear automatically on next refresh; a brand-new department tab needs one line added to this file's DEPT_TABS list.</footer>
  `;
  destroyCharts();
  CATS.forEach((cat,i)=>{
    const r = sectionCounts(dept, cat);
    const sec = d.sections[cat];
    if(r.t>0 && !(sec.monthly && !r.applicable)) makePie(`pie_${i}`, r.y, r.t-r.y);
  });
  bindMonthControl('dept');
}

function renderOverview(){
  const main = document.getElementById('main');
  const deptNames = Object.keys(DATA);
  let totY=0, totT=0;
  const catTotals = {Registers:{y:0,t:0}, KPIs:{y:0,t:0}, SOPs:{y:0,t:0}, Audits:{y:0,t:0}};
  const rows = deptNames.map(d=>{
    if(DATA[d]._error){ return {d, y:0, t:0, p:null, err:true}; }
    const {y,t,pct:p} = overallDeptCounts(d);
    totY+=y; totT+=t;
    CATS.forEach(c=>{ const r = sectionCounts(d,c); catTotals[c].y += r.y; catTotals[c].t += r.t; });
    return {d,y,t,p};
  }).sort((a,b)=> (b.p??-1)-(a.p??-1));

  const notStarted = rows.filter(r=>r.t===0 && !r.err).length;
  const overallPct = pct(totY,totT);

  const catCardsHtml = CATS.map(c=>{
    const p = pct(catTotals[c].y, catTotals[c].t);
    return `<div class="ov-card"><div class="k">${p===null?'—':p+'%'}</div><div class="l">${c} complete (${catTotals[c].y}/${catTotals[c].t})</div></div>`;
  }).join('');

  const tableRows = rows.map(r=>{
    if(r.err){
      return `<tr data-dept="${r.d}">
        <td>${r.d}</td>
        <td><span class="status-pill" style="background:#8a8a8a22;color:#6B7472;">Sync error</span></td>
        <td colspan="2" style="font-family:var(--mono);font-size:11px;color:var(--muted);">Couldn't load this tab</td>
      </tr>`;
    }
    const color = statusColor(r.p);
    const label = r.t===0 ? 'Not started' : (r.p>=80?'On track':(r.p>=50?'In progress':'Behind'));
    return `<tr data-dept="${r.d}">
      <td>${r.d}</td>
      <td><span class="status-pill" style="background:${color}22;color:${color};">${label}</span></td>
      <td>
        <div class="bar-cell">
          <div class="bar-track"><div class="bar-fill" style="width:${r.p??0}%;background:${color};"></div></div>
          <div class="pct-txt">${r.p===null?'—':r.p+'%'}</div>
        </div>
      </td>
      <td style="font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right;">${r.y}/${r.t}</td>
    </tr>`;
  }).join('');

  const errBanner = loadErrors.length ? `<div class="banner error"><b>${loadErrors.length} department${loadErrors.length>1?'s':''} failed to sync:</b> ${loadErrors.join(', ')}. Try "Refresh now" in the sidebar, or check those tab names in Google Sheets haven't changed.</div>` : '';

  main.innerHTML = `
    <div class="top-row">
      <div>
        <h2 class="dept-title">Hospital-wide NABH Readiness</h2>
        <div class="dept-meta">${deptNames.length} departments · ${notStarted} with no data submitted yet${selectedMonth?` · viewing ${selectedMonth}`:''}</div>
      </div>
      <div class="controls-row">
        ${monthControlHtml('ov')}
        <div class="live-badge"><span class="live-dot"></span>Live from Google Sheets</div>
      </div>
    </div>
    <div class="banner"><b>This is live.</b> Every load (and every "Refresh now") pulls the current values straight from your Google Sheet. The month selector switches Registers, KPIs and Audits to that month's recorded status (categories not tracked monthly stay static). New months and new rows in the sheet show up automatically — no rebuild needed.</div>
    ${errBanner}
    <div class="ov-grid">
      <div class="ov-card"><div class="k">${overallPct===null?'—':overallPct+'%'}</div><div class="l">Overall completion (${totY}/${totT})</div></div>
      ${catCardsHtml}
    </div>
    <div class="section-label"><span>Department ranking${selectedMonth?` — ${selectedMonth}`:''}</span></div>
    <table class="ov-table">
      <thead><tr><th>Department</th><th>Status</th><th>Progress</th><th style="text-align:right;">Items</th></tr></thead>
      <tbody>${tableRows}</tbody>
    </table>
    <footer class="note">Click any row to open that department's detailed view. Source: live Google Sheet (${SHEET_ID}).</footer>
  `;
  destroyCharts();
  main.querySelectorAll('tr[data-dept]').forEach(tr=>{
    tr.addEventListener('click', ()=> { if(!DATA[tr.dataset.dept]._error) selectDept(tr.dataset.dept); });
  });
  bindMonthControl('ov');
}

function updateSyncStatus(){
  const el = document.getElementById('syncStatus');
  const timeStr = lastSyncTime ? lastSyncTime.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '—';
  const errPart = loadErrors.length ? ` <span style="color:#E0A98A;">(${loadErrors.length} failed)</span>` : '';
  el.innerHTML = `<b>Last synced:</b> ${timeStr}${errPart}<br>Auto-refreshes every 5 min`;
}

async function fullLoad(showSpinner){
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true; btn.textContent = 'Syncing…';
  if(showSpinner){
    document.getElementById('main').innerHTML = `<div class="loading-screen"><div class="spinner"></div><div class="msg">Pulling live data from Google Sheets…</div></div>`;
  }
  try{
    await loadAllDepartments();
    GLOBAL_MONTHS = CANON_ORDER.filter(m => Object.values(DATA).some(d => d.months && d.months.includes(m)));
    if(!selectedMonth || !GLOBAL_MONTHS.includes(selectedMonth)){
      selectedMonth = GLOBAL_MONTHS.length ? GLOBAL_MONTHS[GLOBAL_MONTHS.length-1] : null;
    }
    renderSidebar(document.getElementById('searchInput').value);
    setActive(currentDept);
    if(currentDept==='__overview__' || !DATA[currentDept]) { currentDept='__overview__'; renderOverview(); }
    else { renderDept(currentDept); }
  } catch(err){
    document.getElementById('main').innerHTML = `<div class="banner error"><b>Couldn't reach Google Sheets.</b> This can happen if the sheet's sharing setting changed, or your connection dropped. Error: ${escapeHtml(err.message||String(err))}</div>`;
  } finally {
    updateSyncStatus();
    btn.disabled = false; btn.textContent = 'Refresh now';
  }
}

document.getElementById('searchInput').addEventListener('input', e=>renderSidebar(e.target.value));
document.getElementById('overviewBtn').addEventListener('click', ()=>selectDept('__overview__'));
document.getElementById('refreshBtn').addEventListener('click', ()=>fullLoad(false));

fullLoad(true);
setInterval(()=>fullLoad(false), AUTO_REFRESH_MS);
</script>
